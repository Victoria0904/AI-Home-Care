        * {
            margin: 0;
            padding: 0;

        html, body {

        /* 加载层 */

            position: fixed;

            align-items: center;

            background: linear-gradient(135deg, #FF8C69 0%, #FFB199 100%);

            transition: opacity 0.4s ease;
        }
        #loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .loader-logo {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }
        .loader-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 28px;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* PC 视图 */
        #pc-view {
            display: none;
            width: 100%;
            height: 100%;
        }
        #pc-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #mobile-view {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        #mobile-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #FAF7F3;
        }

        .switcher {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid #f0ece8;
            padding: 8px 12px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 8px));
            z-index: 9999;
            display: none;
            gap: 8px;
            justify-content: center;
        }
        .switcher-btn {
            flex: 1;
            max-width: 140px;
            padding: 10px 12px;
            border: 1px solid #FFE0D6;
            background: #fff;
            color: #FF8C69;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .switcher-btn.active {
            background: #FF8C69;
            color: #fff;
            border-color: #FF8C69;
        }
        .switcher-btn:active {
            transform: scale(0.96);
        }

            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #FAF7F3;
            padding: 24px;

        .fallback-card {

            width: 100%;
            background: #fff;
            border-radius: 20px;
            padding: 40px 28px;
            box-shadow: 0 8px 32px rgba(255,140,105,0.12);
            text-align: center;
        }
        .fallback-icon {
            width: 64px; height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #FF8C69, #FFB199);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;

        .fallback-card h2 {
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .fallback-card p {
            font-size: 14px;
            color: #5c5c6d;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .fallback-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF8C69, #FFB199);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(255,140,105,0.3);
            margin-bottom: 10px;
        }
        .fallback-btn.secondary {
            background: #FFF0EB;
            color: #FF8C69;
            box-shadow: none;
            border: 1px solid #FFE0D6;
        }
        .fallback-btn:active { transform: scale(0.98); }

        /* PC 端媒体查询 */
        @media (min-width: 769px) {
            #pc-view { display: block; }
        }
        /* 移动端媒体查询 */
        @media (max-width: 768px) {
            #mobile-view { display: block; }
            .switcher { display: flex; }
        }

}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Helvetica Neue&quot;,&quot;Microsoft YaHei&quot;,sans-serif;background:#E9E6E1;color:var(--ink);line-height:1.5}
.phone{position:relative;width:100%;max-width:462px;height:100vh;max-height:932px;margin:0 auto;background:var(--warm);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.12)} .screen{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--warm);display:none;flex-direction:column;overflow:hidden;z-index:1}
.screen.active{display:flex;z-index:2}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0}

.v28-st.green{background:var(--green-bg);color:#0a8f6b}
.v28-st.amber{background:var(--amber-bg);color:var(--amber)}

.v28-main{width:100%;border:none;border-radius:14px;background:linear-gradient(135deg,#FF8C69,#F5603D);color:#fff;padding:13.5px 16px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px -8px rgba(245,96,61,.5);font-family:inherit;transition:transform .12s}

.v28-text-btn{border:none;background:none;color:var(--coral-dk);font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;margin:2px auto 14px;padding:6px 12px;font-family:inherit}
.v28-foot-note{text-align:center;color:var(--ink3);font-size:12px;padding:2px 0 12px}
/* hero */
.hd-dates{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.hd-dates::-webkit-scrollbar{display:none}
.hd-date{flex-shrink:0;border:1.5px solid var(--border);background:#fff;border-radius:14px;padding:7px 14px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;transition:.16s}
.hd-date .d-d{font-size:13.5px;font-weight:800;color:var(--ink)}
.hd-date .d-n{font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:1px}
.hd-date.on{background:linear-gradient(135deg,#FF8C69,#F5603D);border-color:transparent;box-shadow:0 6px 14px -6px rgba(245,96,61,.55)}
.hd-date.on .d-d,.hd-date.on .d-n{color:#fff}
.hd-dates-more{flex-shrink:0;align-self:center;font-size:12px;color:var(--ink2);font-weight:700;padding:0 3px;white-space:nowrap}
.hd-ap{display:flex;flex-direction:column;gap:9px;position:relative;z-index:1}
.ap-row{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .12s,background .2s}
.ap-row:active{transform:scale(.985);background:rgba(255,255,255,.24)}
.ap-time{font-size:13px;font-weight:800;letter-spacing:.5px;width:42px;flex-shrink:0;opacity:.95}
.ap-main{flex:1;min-width:0}
.ap-p{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ap-av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.ap-av.c-coral{background:#fff;color:var(--coral-dk)}
.ap-av.c-blue{background:rgba(255,255,255,.88);color:#2563eb}
.ap-pn{font-size:13.5px;font-weight:800;color:#fff}
.ap-rel{font-size:10.5px;background:rgba(255,255,255,.22);color:#fff;padding:1px 7px;border-radius:10px;font-weight:700}
.ap-dept{font-size:12px;opacity:.92;display:block;color:#fff}
.ap-go{flex-shrink:0;border:none;border-radius:10px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.ap-go-live{background:#fff;color:var(--coral-dk)}
.ap-go-prep{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.55)}
.ap-go .doti{width:6px;height:6px;border-radius:50%;background:var(--green)}
.ap-pill{flex-shrink:0;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);color:#fff;padding:6px 10px;border-radius:10px;white-space:nowrap}
.ap-add{width:100%;border:1.5px dashed rgba(255,255,255,.62);background:transparent;color:#fff;border-radius:13px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.ap-add:active{transform:scale(.99)}
.ap-add svg{width:15px;height:15px}
.ap-empty{background:rgba(255,255,255,.12);border-radius:13px;padding:18px 14px;text-align:center;font-size:12.5px;opacity:.92;line-height:1.5;color:#fff}
.v28-hero{border-radius:20px;padding:18px 18px 14px;color:#fff;background:linear-gradient(135deg,#FF8C69 0%,#F5603D 100%);margin-bottom:14px;box-shadow:0 12px 28px -12px rgba(245,96,61,.5);position:relative;overflow:hidden}
.v28-hero::after{content:&quot;&quot;;position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}
.v28-hero-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative;z-index:1}
.v28-hero-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v28-hero-ic svg{width:26px;height:26px}
.v28-hero-day{font-size:21px;font-weight:800;letter-spacing:.3px;line-height:1.25}
.v28-hero-info{flex:1;min-width:0}.v28-hero-sub{font-size:12.5px;opacity:.92;margin-top:3px}
.v28-rail{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 4px;position:relative;z-index:1}
.v28-rail::-webkit-scrollbar{display:none}
.v28-dept{flex:1 1 0;min-width:0;width:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:15px;padding:12px 13px;cursor:pointer;transition:transform .12s,background .2s}
.v28-dept:active{transform:scale(.97)}
.v28-dept-time{font-size:12px;font-weight:700;opacity:.9;letter-spacing:1px}
.v28-dept-name{font-size:15.5px;font-weight:800;margin:3px 0 1px}
.v28-dept-doc{font-size:11.5px;opacity:.88;margin-bottom:9px}
.v28-dept .v28-st{margin-bottom:10px}
.v28-dept .v28-st.green{background:rgba(255,255,255,.22);color:#fff}
.v28-dept-go{width:100%;border:none;border-radius:10px;background:#fff;color:var(--coral-dk);font-size:12.5px;font-weight:800;padding:8px 0;cursor:pointer;font-family:inherit}
.v28-dept-go.ghost{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5)}
.v28-dept-add{flex:0 0 auto;width:42px;height:42px;border:1.5px dashed rgba(255,255,255,.75);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;align-self:center;background:rgba(255,255,255,.14);transition:transform .12s,background .2s}
.v28-dept-add:active{transform:scale(.92)}
.v28-dept-add span{display:none}
.v28-dept-add svg{width:19px;height:19px}
/* guide */
.v28-seg{display:flex;gap:9px;margin-bottom:13px}
.v28-seg-btn{flex:1;border:1.5px solid var(--border);background:#fff;color:var(--coral-dk);border-radius:12px;padding:10px 6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.18s}
.v28-seg-btn.on{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 6px 14px -6px rgba(245,96,61,.55)}
.v28-seg-btn:active{transform:scale(.97)}
.v28-field{display:block;margin-bottom:10px}
.v28-lab{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);font-weight:700;margin-bottom:5px}
.v28-lab em{font-style:normal;color:var(--coral-dk)}
.v28-lab em.opt{color:var(--ink3);font-weight:600;background:#f4f1ed;padding:1px 7px;border-radius:10px;font-size:11px}
.v28-field input,.v28-field select{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:10.5px 12px;font-size:13.5px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
.v28-field input:focus,.v28-field select:focus{border-color:var(--coral)}
.v28-cam{display:flex;align-items:center;gap:7px;border:1.5px dashed var(--coral);background:var(--coral-bg);color:var(--coral-dk);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer;margin:3px 0 11px;font-family:inherit;width:100%}
.v28-cam svg{width:17px;height:17px}
.v28-cam:active{transform:scale(.98)}
/* todo */
.v28-todo{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:var(--warm);margin-bottom:8px;cursor:pointer;transition:transform .12s}
.v28-todo:last-child{margin-bottom:0}
.v28-todo:active{transform:scale(.98)}
.v28-todo-info{flex:1;min-width:0}
.v28-todo-t{font-size:13.5px;font-weight:800;color:var(--ink)}
.v28-todo-s{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.45}
.v28-mini{flex-shrink:0;font-size:12px;font-weight:800;color:#fff;background:var(--coral);padding:7px 13px;border-radius:20px}
.v28-mini.ghost{background:var(--coral-bg);color:var(--coral-dk)}
/* family avatars */
.v28-fam-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px}
.v28-fam-row::-webkit-scrollbar{display:none}
.v28-fam{flex-shrink:0;width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.v28-fam-av{width:52px;height:52px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;position:relative}
.v28-fam-av.blue{background:var(--blue)}
.v28-fam-av.green{background:var(--green)}
.v28-fam-av.amber{background:#F59E0B}
.v28-fam-av.dashed{background:#fff;border:1.5px dashed var(--coral);color:var(--coral)}
.v28-fam-av.dashed svg{width:21px;height:21px}
.v28-fam-dot{position:absolute;top:0;right:0;width:13px;height:13px;border-radius:50%;background:var(--red);border:2.5px solid #fff}
.v28-fam-nm{font-size:12.5px;font-weight:700;color:var(--ink)}
.v28-fam-st{font-size:10.5px;color:var(--coral-dk);font-weight:700}
.v28-fam-st.off{color:var(--ink3);font-weight:500}
.v28-fam-badge{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:9px;white-space:nowrap}
.v28-follow{display:flex;align-items:center;gap:7px;margin-top:13px;padding-top:12px;border-top:1px dashed #f0e6e0;font-size:13px;font-weight:800;color:var(--ink)}
.v28-follow-s{font-weight:500;color:var(--ink2);font-size:12px;margin-left:2px}
/* complaint switcher */
.v28-comp-sw{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 12px}
.v28-comp-sw::-webkit-scrollbar{display:none}
.v28-cp{flex-shrink:0;display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--border);border-radius:22px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:.18s}
.v28-cp.on{border-color:var(--coral);background:var(--coral-bg);color:var(--coral-dk)}
.v28-cp-dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.v28-cp.on .v28-cp-dot{background:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.v28-cp-time{font-size:11.5px;color:var(--ink2);font-weight:600}
.v28-cp.on .v28-cp-time{color:var(--coral-dk)}
.v28-cp-tag{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:12px}
.v28-cp-tag.green{background:var(--green-bg);color:#0a8f6b}
.v28-cp-tag.amber{background:var(--amber-bg);color:var(--amber)}
.v28-cp-add{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--coral);color:var(--coral);display:flex;align-items:center;justify-content:center;cursor:pointer;align-self:center;background:#fff}
.v28-dept-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}
.v28-dept-hd-n{font-size:19px;font-weight:800;color:var(--ink)}
.v28-dept-hd-s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.v28-empty{text-align:center;padding:8px 0 4px}
.v28-empty svg{width:34px;height:34px;color:var(--ink3);margin-bottom:8px}
.v28-empty p{font-size:13px;color:var(--ink2);margin-bottom:12px}
.v28-empty .v28-main{max-width:220px;margin:0 auto}
/* history groups */
.v28-hist-g{border:1.5px solid var(--border);border-radius:14px;margin-bottom:9px;overflow:hidden}
.v28-hist-g:last-child{margin-bottom:0}
.v28-hist-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;background:#fff;transition:background .15s}
.v28-hist-hd:active{background:var(--warm)}
.v28-hist-t{font-size:14px;font-weight:800;color:var(--ink)}
.v28-hist-n{font-size:11px;font-weight:700;color:var(--coral-dk);background:var(--coral-bg);padding:2px 9px;border-radius:11px}
.v28-chev{width:17px;height:17px;color:var(--ink3);margin-left:auto;transition:transform .25s}

.v28-hist-arrow{color:var(--ink3);font-size:13px;font-weight:600}

.lr-vs-add{flex:0 0 auto;width:42px;height:42px;align-self:center;border:1.5px dashed var(--coral);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--coral);cursor:pointer;background:#fff;transition:transform .12s}.lr-vs-add:active{transform:scale(.92)}

.v28-account:active{transform:scale(.99)}
.v28-acc-av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#FF8C69,#F5603D);color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v28-acc-info{flex:1;min-width:0}
.v28-acc-name{font-size:16px;font-weight:800;color:var(--ink)}

.v28-li:last-child{border-bottom:none}

.v28-li-ic.blue{background:var(--blue-bg);color:var(--blue)}
.v28-li-ic.green{background:var(--green-bg);color:var(--green)}
.v28-li-ic.amber{background:var(--amber-bg);color:var(--amber)}
.v28-li-info{flex:1;min-width:0}
.v28-li-t{font-size:14.5px;font-weight:700;color:var(--ink);display:flex;align-items:center}
.v28-li-s{font-size:12px;color:var(--ink2);margin-top:2px}
.v28-li-arrow{color:var(--ink3);font-size:20px;flex-shrink:0}

.v28-noti-t{font-size:14px;color:var(--ink)}
.v28-ok{font-size:12px;font-weight:800;color:#0a8f6b;background:var(--green-bg);padding:3px 10px;border-radius:12px}
.v28-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.v28-chips button{border:1.5px solid var(--border);background:#fff;color:var(--ink2);font-size:12px;font-weight:600;padding:7px 13px;border-radius:20px;cursor:pointer;font-family:inherit}

.v28-switch-row{padding-top:12px}

.v28-src-map{border:1.5px solid var(--border);border-radius:13px;overflow:hidden;margin-bottom:12px}
.v28-src-row{display:flex;align-items:center;gap:8px;padding:10px 13px;font-size:12.5px;border-bottom:1px dashed #f0e6e0}
.v28-src-row:last-child{border-bottom:none}
.v28-src-row.hl{background:var(--coral-bg)}
.v28-src-l{color:var(--ink2);flex:1;text-align:right}
.v28-src-arrow{color:var(--ink3);font-size:12px;flex-shrink:0}
.v28-src-r{color:var(--ink);font-weight:800;flex:1.2}
.v28-privacy{display:flex;flex-direction:column;gap:9px;margin-bottom:11px}
.v28-pv-i{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink)}
.v28-pv-ck{width:20px;height:20px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v28-pv-ck svg{width:12px;height:12px}
.v28-pv-st{margin-left:auto;font-size:11px;font-weight:800;color:#0a8f6b}
.v28-src-note{font-size:11.5px;color:var(--ink3);line-height:1.6;background:var(--warm);border-radius:10px;padding:9px 12px}
.v28-logout{width:100%;border:1.5px solid var(--red-bg);background:#fff;color:var(--red);border-radius:16px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;margin-bottom:14px}
.v28-logout svg{width:19px;height:19px}
.v28-logout:active{transform:scale(.98)}

<script>
(function() {
    var ua = navigator.userAgent || '';
    var isHarmony = /HarmonyOS|OpenHarmony|鸿蒙|HUAWEI.*Mobile/i.test(ua);
    var isMobile = /Android|webOS|iPhone|iPad|iPod|HarmonyOS|OpenHarmony|Mobile/i.test(ua);
    var isNarrow = window.innerWidth <= 768;
    
    if (isMobile || isNarrow) {
        document.documentElement.classList.add('_aihc_mobile');
        
        if (isHarmony) {
            document.documentElement.classList.add('_aihc_harmony');
        }
        
        // 鸿蒙系统：多次触发重排，确保布局正确
        if (isHarmony) {
            var redrawCount = 0;
            var redrawInterval = setInterval(function() {
                document.body.style.display = 'none';
                document.body.offsetHeight;
                document.body.style.display = '';
                window.dispatchEvent(new Event('resize'));
                redrawCount++;
                if (redrawCount >= 3) {
                    clearInterval(redrawInterval);
                }
            }, 100);
        }
        
        // 视口高度动态调整
        function setVh() {
            var vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
        }
        setVh();
        window.addEventListener('resize', setVh);
        window.addEventListener('orientationchange', function() {
            setTimeout(setVh, 200);
        });
    }
})();
</script>

function pickSpk(el){

function applyIdentity(){
  var map={},label={};
  var ok=true;
  document.querySelectorAll('.spkchip.sel').forEach(function(c){
    var spk=c.dataset.spk, role=c.dataset.role;
    map[spk]=role;
    if(role==='other'){
      var inp=document.getElementById('other-name-'+spk);
      var v=inp?inp.value.trim():'';
      if(!v){ok=false;label[spk]='';} else {label[spk]=v;}
    }
  });
  if(!ok){toast('选“其他人”时请填写这位是谁');return;}
  ['live-trans','live-trans-preview'].forEach(function(id){
    var box=document.getElementById(id); if(!box) return;
    box.classList.add('is-mapped');
    box.querySelectorAll('.lt-msg').forEach(function(m){
      var role=map[m.dataset.spk]; if(!role) return;
      m.setAttribute('data-role',role);
      var tag=m.querySelector('.spk-role'), sub=m.querySelector('.sub-role');
      if(role==='doc'){tag.className='tag doc spk-role';tag.textContent='医生';sub.textContent='张医生';}
      else if(role==='fam'){tag.className='tag fam spk-role';tag.textContent='患者';sub.textContent='妈妈（王秀兰）';}
      else {tag.className='tag other spk-role';tag.textContent='其他人';sub.textContent=label[m.dataset.spk];}
    });
  });
  function desc(spk){
    var r=map[spk];
    return r==='doc'?'张医生（医生）':r==='fam'?'妈妈（王秀兰，患者）':(label[spk]+'（其他人，不计入医嘱）');
  }
  var hasOther=map.A==='other'||map.B==='other';
  var pvb=document.getElementById('spkmap-btn-pv');if(pvb)pvb.style.display='none';
  var pvr=document.getElementById('spkreset-btn-pv');if(pvr)pvr.style.display='inline-block';
  var bar=document.getElementById('spk-map-bar');if(bar)bar.classList.add('is-done');
  var t1=document.getElementById('spkbar-t');if(t1)t1.textContent='已确认：说话人A = '+desc('A')+'，说话人B = '+desc('B');
  var t2=document.getElementById('spkbar-s');if(t2)t2.textContent='身份已映射到本次全部发言，'+
    (hasOther?'蓝色为医生原话、右侧灰色为妈妈陈述、其余单独列出不计入医嘱':'蓝色为医生原话、右侧灰色为妈妈陈述')+'，将据此生成摘要。';
  var b1=document.getElementById('spkmap-btn');if(b1)b1.style.display='none';
  var b2=document.getElementById('spkreset-btn');if(b2)b2.style.display='block';
  closeModal();toast('已按声纹批量标注，摘要将区分医生原话、患者陈述与其他人发言');
}

    <script>
    (function() {
        'use strict';

        // ===== 设备检测 =====
        var ua = navigator.userAgent || '';
        var isHarmony = /HarmonyOS|OpenHarmony|鸿蒙|HUAWEI.*Mobile/i.test(ua);
        var isMobile = /Android|webOS|iPhone|iPad|iPod|HarmonyOS|OpenHarmony|Mobile/i.test(ua);
        var screenWidth = window.innerWidth || document.documentElement.clientWidth || screen.width;
        var isMobileView = isMobile || screenWidth <= 768;

        var loader = document.getElementById('loader');
        var pcFrame = document.getElementById('pc-frame');
        var mobileFrame = document.getElementById('mobile-frame');
        var fallback = document.getElementById('fallback');
        var switcher = document.getElementById('switcher');

        var activeFrame = isMobileView ? mobileFrame : pcFrame;
        var loaded = false;
        var loadTimer = null;

        // ===== 隐藏加载层 =====
        function hideLoader() {
            if (loaded) return;
            loaded = true;
            setTimeout(function() {
                loader.classList.add('fade-out');
                setTimeout(function() { loader.style.display = 'none'; }, 400);
            }, 300);
            if (loadTimer) clearTimeout(loadTimer);
        }

        function showFallback() {
            loader.style.display = 'none';
            fallback.classList.add('show');
        }

        // ===== 加载监听 =====
        activeFrame.onload = function() {
            hideLoader();
        };
        activeFrame.onerror = function() {
            showFallback();
        };

        // 加载超时降级
        loadTimer = setTimeout(function() {
            if (!loaded) {
                setTimeout(function() {
                    if (!loaded) showFallback();
                }, 5000);
            }
        }, 12000);

        // ===== 鸿蒙系统专项 =====
        if (isHarmony) {
            document.documentElement.classList.add('aihc-harmony');
            // 防止双指缩放
            document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
            // 防止双击缩放
            var lastTouch = 0;
            document.addEventListener('touchend', function(e) {
                var now = Date.now();
                if (now - lastTouch <= 300) e.preventDefault();
                lastTouch = now;
            }, { passive: false });
            // 动态视口高度
            function setVh() {
                var vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', vh + 'px');
                var mv = document.getElementById('mobile-view');
                if (mv) mv.style.height = window.innerHeight + 'px';
            }
            setVh();
            window.addEventListener('resize', setVh);
            window.addEventListener('orientationchange', function() {
                setTimeout(setVh, 250);
            });
        }

        // ===== 切换模式 =====
        var currentMode = 'family';
        var switchBtns = switcher.querySelectorAll('.switcher-btn');

        switchBtns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var mode = btn.getAttribute('data-mode');
                if (mode === currentMode) return;
                currentMode = mode;

                switchBtns.forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');

                // 显示加载
                loaded = false;
                loader.style.display = 'flex';
                loader.classList.remove('fade-out');

                if (mode === 'family') {
                    // 重新加载家属端 srcdoc
                    mobileFrame.srcdoc = mobileFrame.getAttribute('data-family-srcdoc') || mobileFrame.srcdoc;
                } else if (mode === 'patient') {
                    // 跳转到 Coze 患者端页面
                    window.open('https://4bb2j296zc.page.coze.site', '_blank');
                    // 切回家属端按钮状态
                    setTimeout(function() {
                        currentMode = 'family';
                        switchBtns.forEach(function(b) {
                            b.classList.remove('active');
                            if (b.getAttribute('data-mode') === 'family') b.classList.add('active');
                        });
                        hideLoader();
                    }, 500);
                } else if (mode === 'full') {
                    // 跳转到完整演示页
                    window.open('https://4bb2j296zc.page.coze.site', '_blank');
                    setTimeout(function() {
                        currentMode = 'family';
                        switchBtns.forEach(function(b) {
                            b.classList.remove('active');
                            if (b.getAttribute('data-mode') === 'family') b.classList.add('active');
                        });
                        hideLoader();
                    }, 500);
                }
            });
        });

        // 保存家属端 srcdoc 用于重新加载
        mobileFrame.setAttribute('data-family-srcdoc', mobileFrame.srcdoc);

        // ===== 调试信息 =====
        console.log('[AI伴诊] 设备:', {
            isMobile: isMobile,
            isHarmony: isHarmony,
            screenWidth: screenWidth,
            view: isMobileView ? 'mobile' : 'pc'
        });
    })();
    </script>
