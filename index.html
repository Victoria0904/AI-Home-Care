<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="AI 驱动的家属远程陪诊平台 — 让不在身边的家属，也能全程安心参与患者就医。">
    <meta name="keywords" content="AI陪诊,远程陪诊,智慧医疗,家属陪诊,智能就医">
    <meta property="og:title" content="AI Home Care - 智慧远程陪诊平台">
    <meta property="og:description" content="AI 驱动的家属远程陪诊平台 — 让不在身边的家属，也能全程安心参与患者就医。">
    <meta property="og:type" content="website">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4A90D9">
    <title>AI Home Care - 智慧远程陪诊平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-logo {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .loader-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Iframe Container */
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #app-frame.show {
            opacity: 1;
        }

        /* Fallback */
        #fallback {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
            padding: 20px;
            text-align: center;
        }

        #fallback.show {
            display: flex;
        }

        .fallback-card {
            max-width: 420px;
            background: #fff;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .fallback-card h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 12px;
        }

        .fallback-card p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .fallback-btn {
            display: inline-block;
            padding: 12px 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .fallback-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-logo">AI Home Care</div>
        <div class="loader-subtitle">正在加载智慧陪诊平台...</div>
        <div class="spinner"></div>
    </div>

    <!-- Coze App Iframe -->
    <iframe
        id="app-frame"
        src="https://www.coze.cn/s/mPte90Sz1ws/"
        allow="microphone; camera; geolocation; clipboard-read; clipboard-write; encrypted-media"
        allowfullscreen
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-presentation"
    ></iframe>

    <!-- Fallback (shown if iframe fails to load) -->
    <div id="fallback">
        <div class="fallback-card">
            <h2>AI Home Care</h2>
            <p>智能远程陪诊平台正在为您打开，请点击下方按钮继续访问。</p>
            <a class="fallback-btn" href="https://www.coze.cn/s/mPte90Sz1ws/" target="_blank" rel="noopener noreferrer">
                进入平台
            </a>
        </div>
    </div>

    <script>
        (function() {
            var loader = document.getElementById('loader');
            var frame = document.getElementById('app-frame');
            var fallback = document.getElementById('fallback');
            var loaded = false;

            // Hide loader and show iframe when loaded
            frame.onload = function() {
                loaded = true;
                setTimeout(function() {
                    loader.classList.add('fade-out');
                    frame.classList.add('show');
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 500);
                }, 300);
            };

            // Fallback: if iframe doesn't load within 12 seconds, show fallback
            setTimeout(function() {
                if (!loaded) {
                    loader.style.display = 'none';
                    fallback.classList.add('show');
                }
            }, 12000);

            // Detect mobile and adjust viewport
            function setViewportHeight() {
                var vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', vh + 'px');
            }
            setViewportHeight();
            window.addEventListener('resize', setViewportHeight);

            // Prevent pull-to-refresh on mobile
            document.body.addEventListener('touchmove', function(e) {
                if (e.target.tagName !== 'IFRAME') {
                    e.preventDefault();
                }
            }, { passive: false });
        })();
    </script>
</body>
</html>
